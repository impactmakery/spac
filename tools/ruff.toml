# The generator follows the API's settings. `handover_sections.py` is content
# rather than code — each row of a table is one line of prose — so the line
# limit does not apply there. Wrapping those rows makes them harder to read and
# edit than the long lines it would replace.
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Both hold content rather than code: one table row is one line of prose, and
# wrapping those rows makes them harder to read and edit than the long lines
# they would replace.
"handover_sections.py" = ["E501"]
"build_technology_doc.py" = ["E501"]

[lint.isort]
# handover_sections.py sits beside the generator, so it is our code, not a
# package — without this ruff groups it with third-party imports.
known-first-party = ["handover_sections"]
