name: CI
on:
  push: { branches: [main] }
  pull_request:

# Pushing twice in quick succession ran the whole suite twice. The older run is
# superseded anyway, and the api job is the expensive one — a Postgres service
# container plus ~300 tests.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    # Without this a hung job runs to the 6-hour default, silently consuming
    # the account's Actions minutes. Both jobs finish well inside 20.
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which is what the lockfile was resolved with.
      # On npm 10 the optional @swc/helpers peer of next-intl's @swc/core
      # resolves differently and `npm ci` rejects the lockfile.
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # PageProps/LayoutProps are globals Next generates into .next/types,
      # which is gitignored — typegen must run before typechecking.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: tah, POSTGRES_PASSWORD: tah, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tah" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_PG_URI: postgresql://tah:tah@localhost:5432/postgres
      DATABASE_URL: postgresql+psycopg://tah:tah@localhost:5432/postgres
      # Test-only values. Production secrets live in the Railway env store;
      # .env is never committed, so CI must supply its own.
      JWT_SECRET: ci-test-jwt-secret-not-used-anywhere-else
      CRON_SECRET: ci-test-cron-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -v
